services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: dianaarnautova/docker-project-74
    build:
      context: .
      dockerfile: Dockerfile.production
    working_dir: /app
    command: make test
    env_file:
      - ./app/.env
    depends_on:
      db:
        condition: service_healthy
