services:
  app:
    image: dianaarnautova/docker-project-74
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/app
      - app_node_modules:/app/node_modules
    command: make dev
    ports:
      - "8080:8080"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./services/caddy/Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - app

volumes:
  app_node_modules:
